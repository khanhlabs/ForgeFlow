spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  auth:
    refresh-token-expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
    access-token-expiration-minutes: ${ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    jwt-secret: ${JWT_SECRET}